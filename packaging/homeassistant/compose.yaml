# Manual staging profile; not integrated with Core module lifecycle yet.
# Run resolve-image.sh and export HOME_ASSISTANT_IMAGE from its output first.
services:
  homeassistant:
    image: ${HOME_ASSISTANT_IMAGE:?Resolve and pin a registry image digest first}
    container_name: home-ai-homeassistant
    restart: unless-stopped
    stop_grace_period: 60s
    privileged: true
    network_mode: host
    environment:
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - /var/lib/home-ai-core/integrations/homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
