name: Security review snapshot

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/home-ai-core-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: security-review-source
          path: ${{ runner.temp }}/home-ai-core-source.tar.gz
          retention-days: 1
          if-no-files-found: error
