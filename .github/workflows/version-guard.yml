name: Version guard

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  require-version-bump:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require VERSION change for every release change
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch origin "$BASE_REF" --depth=1
            RANGE="origin/$BASE_REF..HEAD"
          else
            if [[ -z "${BEFORE_SHA:-}" || "$BEFORE_SHA" =~ ^0+$ ]]; then
              exit 0
            fi
            RANGE="$BEFORE_SHA..HEAD"
          fi

          changed=$(git diff --name-only "$RANGE")

          if [[ -z "$changed" ]]; then
            exit 0
          fi

          if ! grep -qx "VERSION" <<<"$changed"; then
            echo "::error::Every develop/main change must advance VERSION because the Web updater is version-based."
            echo "$changed"
            exit 1
          fi
