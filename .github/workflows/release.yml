name: Release Debian packages

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Debian package
        run: sh ./scripts/build-deb.sh "${{ matrix.arch }}"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: build/packages/*.deb
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          merge-multiple: true
          path: dist

      - name: Build update manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          DEBIAN_VERSION="${VERSION//-/~}"

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          version = Path("VERSION").read_text().strip()
          debian_version = version.replace("-", "~")
          packages = {}

          for arch in ("amd64", "arm64"):
              files = sorted(Path("dist").glob(f"home-ai-core_*_{arch}.deb"))
              if len(files) != 1:
                  raise SystemExit(f"expected exactly one {arch} package, found {len(files)}")
              path = files[0]
              data = path.read_bytes()
              packages[arch] = {
                  "file": path.name,
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "size_bytes": len(data),
                  "debian_version": debian_version,
              }

          manifest = {
              "schema_version": 1,
              "version": version,
              "packages": packages,
          }
          Path("dist/home-ai-core-update.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          cat dist/home-ai-core-update.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          TAG="v$VERSION"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/*               --target "$GITHUB_SHA"               --title "Home-AI-Core $VERSION"               --generate-notes               --prerelease
          fi
