name: Web UI browser regressions
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the actual Web bundle
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run build
      - name: Install browser test runtime
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Exercise audited UI workflows with isolated API fixtures
        env:
          UI_EVIDENCE_DIR: ${{ runner.temp }}/ui-evidence
        run: |
          python web/tests/browser_regressions.py
          python web/tests/csrf_regressions.py
          python web/tests/files_regressions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-ui-regression-evidence
          path: ${{ runner.temp }}/ui-evidence
          retention-days: 7
          if-no-files-found: ignore
