name: Isolated security toolchain
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/security-toolchain.yml']
permissions:
  contents: read
jobs:
  toolchain:
    if: github.head_ref == 'chatgpt/core-security-port82-20261013'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - run: |
          go mod download
          tar -czf "$RUNNER_TEMP/go-toolchain.tar.gz" -C "$(go env GOROOT)" .
          tar -czf "$RUNNER_TEMP/go-modules.tar.gz" -C "$(go env GOMODCACHE)" .
      - uses: actions/upload-artifact@v4
        with:
          name: security-offline-toolchain
          path: |
            ${{ runner.temp }}/go-toolchain.tar.gz
            ${{ runner.temp }}/go-modules.tar.gz
          retention-days: 1
          compression-level: 0
