name: Prepare reviewed security tree
on:
  pull_request:
    branches: [main]
    paths: ['_security_import/bundle.b64', '_security_import/repairs.json']
permissions:
  contents: write
jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == 'DeadSoulf/home-ai-core' && github.head_ref == 'chatgpt/core-security-port82-20261013'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify patch and create an unreferenced commit for explicit review
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, concurrent.futures, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          repo = 'DeadSoulf/home-ai-core'
          parent = os.environ['EXPECTED_HEAD']
          assert len(parent) == 40 and all(c in '0123456789abcdef' for c in parent)
          assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == parent
          hashes = ['823a8075bad3c4e2b8b69709fcd75a78569858f75dcf7392eee28fd0417803af','ad77bb374eeab4e866efc97776db0bd22b354301cebc91db20da9664f4cc2762','f8db1407d326474c09687a2756b69f1643485289fbb699ecfaea32ceed68f79b','ba8d0ff243b15e7a922cac2acbc4bfa15b01922a2b3fc00a750fdb38b242217e','c4974104c0d64e7c7c03b06ca08ea7b970ea074c99c46e307ee2a688f7ef8f0b','14050b24938e59238fdc2b28598cfef5b666d6ce7ea1f1b6d8448da52be234af','974c5744d3c713106c45187c458c82da0d52e9ebd50886b5fbcd49f42684a3a5','d6acf7d345844d0a320b9b3e4481d9e8a135def328cfe8b0a5aa89f9ddeee0a2','59cef4a074a67f2555c210de0e74393c033c40f92fa58a60106b88f5997dfda5','16aa697c5942e7143bacd3e902b2efaf01788b10ccfe5e3a7b29e9d3b46e6fb2','28b0a1df836f8cba84b1930bfe6872885fbd7aae53ecbed69a168e17436496ad','8ce60340d5c2f2576178cc95e9b4d8f45418c7e5391582a45d5858c91752362c','965d38d87c4b5528c4819042a948fb751901d4ed3d18b1f9d695eb7af0afaff3']
          repairs_path = pathlib.Path('_security_import/repairs.json')
          repairs = json.loads(repairs_path.read_text()) if repairs_path.exists() else {}
          chunks, valid = [], True
          for i, expected in enumerate(hashes):
              name = f'ch{i:02d}'
              value = pathlib.Path('_security_import', name).read_bytes().strip()
              for start, end, replacement in sorted(repairs.get(name, []), reverse=True):
                  assert 0 <= start <= end <= len(value)
                  value = value[:start] + replacement.encode('ascii') + value[end:]
              actual = hashlib.sha256(value).hexdigest()
              print(name, len(value), actual, 'OK' if actual == expected else 'MISMATCH', flush=True)
              valid = valid and actual == expected
              chunks.append(value)
          assert valid, 'transport checksum mismatch; no code applied'
          encoded = b''.join(chunks)
          assert len(encoded) < 100000
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) < 1000000
          assert hashlib.sha256(patch).hexdigest() == '70e603a4face29a5bc3270b85047e2654af28ed4de5b2e80067c4cfb51f411d3'
          subprocess.run(['git','apply','--check','--index','-'], input=patch, check=True)
          subprocess.run(['git','apply','--index','-'], input=patch, check=True)
          subprocess.run(['git','rm','-r','-f','--ignore-unmatch','_security_import','.github/workflows/security-import.yml','.github/workflows/security-review.yml','.github/workflows/security-toolchain.yml'], check=True)
          subprocess.run(['git','diff','--cached','--check'], check=True)
          def api(path, data=None):
              raw = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request('https://api.github.com/repos/'+repo+'/git/'+path, data=raw, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req, timeout=60) as r: return json.load(r)
          base_tree = api('commits/'+parent)['tree']['sha']
          lines = subprocess.check_output(['git','diff','--cached','--name-status'],text=True).splitlines()
          def blob(line):
              status,path = line.split('\t',1)
              assert '..' not in pathlib.PurePosixPath(path).parts and not path.startswith('/')
              if status == 'D': return {'path':path,'mode':'100644','type':'blob','sha':None}
              assert status in ('A','M')
              mode = subprocess.check_output(['git','ls-files','-s','--',path],text=True).split()[0]
              content = pathlib.Path(path).read_bytes()
              sha = api('blobs',{'content':base64.b64encode(content).decode(),'encoding':'base64'})['sha']
              return {'path':path,'mode':mode,'type':'blob','sha':sha}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              entries = list(pool.map(blob,lines))
          tree = api('trees',{'base_tree':base_tree,'tree':entries})['sha']
          commit = api('commits',{'message':'fix(core): enforce signed privileged updates, HTTPS on 82 and recoverable module installs','tree':tree,'parents':[parent]})['sha']
          result = {'parent':parent,'tree':tree,'commit':commit,'patch_sha256':hashlib.sha256(patch).hexdigest(),'changed_files':len(entries)}
          pathlib.Path(os.environ['RUNNER_TEMP'],'prepared-security-commit.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-security-commit
          path: ${{ runner.temp }}/prepared-security-commit.json
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: transport-diagnostics
          path: _security_import/ch*
          retention-days: 1
