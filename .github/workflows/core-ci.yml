name: core-ci

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: false

      - name: Resolve modules
        run: go mod download

      - name: Format check
        run: |
          test -z "$(gofmt -l ./cmd ./internal)"

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: ./scripts/build.sh

      - name: Dependency snapshot
        if: always()
        run: |
          go mod tidy
          echo '--- go.mod ---'
          cat go.mod
          echo '--- go.sum ---'
          cat go.sum
