name: core-ci

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: false

      - name: Dependency lock check
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Format check
        run: |
          UNFORMATTED="$(gofmt -l ./cmd ./internal)"
          if [ -n "$UNFORMATTED" ]; then
            echo "The following Go files need gofmt:"
            echo "$UNFORMATTED"
            gofmt -d $UNFORMATTED
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: ./scripts/build.sh

      - name: Integration smoke test
        run: |
          set -eu
          STATE_DIR="$(mktemp -d)"
          LOG_FILE="$(mktemp)"
          COOKIE_JAR="$(mktemp)"
          ./build/home-ai-core --state-dir "$STATE_DIR" --listen 127.0.0.1:18080 >"$LOG_FILE" 2>&1 &
          PID=$!
          cleanup() {
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
            rm -rf "$STATE_DIR" "$LOG_FILE" "$COOKIE_JAR"
          }
          trap cleanup EXIT INT TERM

          ready=0
          for _ in $(seq 1 75); do
            if curl --fail --silent http://127.0.0.1:18080/health >/tmp/home-ai-health.json; then
              ready=1
              break
            fi
            sleep 0.2
          done

          if [ "$ready" -ne 1 ]; then
            cat "$LOG_FILE"
            exit 1
          fi

          curl --fail --silent             http://127.0.0.1:18080/api/v1/security/setup-status             >/tmp/home-ai-setup.json

          test -f "$STATE_DIR/bootstrap-token"
          BOOTSTRAP_TOKEN="$(tr -d '\r\n' < "$STATE_DIR/bootstrap-token")"

          UNAUTH_STATUS="$(curl --silent --output /tmp/home-ai-unauth.json --write-out '%{http_code}'             http://127.0.0.1:18080/api/v1/system)"
          test "$UNAUTH_STATUS" = "401"

          curl --fail --silent             --cookie-jar "$COOKIE_JAR"             -H "Content-Type: application/json"             -H "X-Home-AI-Bootstrap-Token: $BOOTSTRAP_TOKEN"             --data '{"username":"owner","display_name":"CI Owner","password":"integration-test-owner-passphrase","session_mode":"cookie"}'             http://127.0.0.1:18080/api/v1/security/bootstrap             >/tmp/home-ai-bootstrap.json

          test ! -f "$STATE_DIR/bootstrap-token"

          curl --fail --silent             --cookie "$COOKIE_JAR"             http://127.0.0.1:18080/api/v1/system             >/tmp/home-ai-system.json

          curl --fail --silent             --cookie "$COOKIE_JAR"             http://127.0.0.1:18080/api/v1/auth/me             >/tmp/home-ai-me.json

          curl --fail --silent             --cookie "$COOKIE_JAR"             http://127.0.0.1:18080/api/v1/audit             >/tmp/home-ai-audit.json

          CSRF_TOKEN="$(python3 - <<'PY'
          import json
          with open("/tmp/home-ai-bootstrap.json", "r", encoding="utf-8") as f:
              print(json.load(f)["csrf_token"])
          PY
          )"

          curl --fail --silent             --cookie "$COOKIE_JAR"             -H "X-CSRF-Token: $CSRF_TOKEN"             -X POST             http://127.0.0.1:18080/api/v1/auth/logout             >/dev/null

          REVOKED_STATUS="$(curl --silent --output /tmp/home-ai-revoked.json --write-out '%{http_code}'             --cookie "$COOKIE_JAR"             http://127.0.0.1:18080/api/v1/system)"
          test "$REVOKED_STATUS" = "401"

          python3 - <<'PY'
          import json

          with open("/tmp/home-ai-health.json", "r", encoding="utf-8") as f:
              health = json.load(f)
          assert health["status"] == "ok"

          with open("/tmp/home-ai-setup.json", "r", encoding="utf-8") as f:
              setup = json.load(f)
          assert setup["initialized"] is False

          with open("/tmp/home-ai-system.json", "r", encoding="utf-8") as f:
              system = json.load(f)
          assert system["schema_version"] >= 2
          assert system["system"]["node_id"]
          assert system["system"]["cpu"]["logical_cpus"] >= 1

          with open("/tmp/home-ai-me.json", "r", encoding="utf-8") as f:
              me = json.load(f)
          assert me["actor"]["username"] == "owner"
          assert "system.read" in me["actor"]["permissions"]

          with open("/tmp/home-ai-audit.json", "r", encoding="utf-8") as f:
              audit = json.load(f)
          assert any(event["action"] == "security.bootstrap" for event in audit["events"])
          PY

          test -f "$STATE_DIR/core.db"
          test -f "$STATE_DIR/identity/node-id"

      - name: Cross-build Linux targets
        run: |
          VERSION="$(cat VERSION)"
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build               -trimpath               -ldflags "-s -w -X github.com/DeadSoulf/home-ai-core/internal/version.Version=$VERSION"               -o "/tmp/home-ai-core-linux-$arch"               ./cmd/home-ai-core
          done
