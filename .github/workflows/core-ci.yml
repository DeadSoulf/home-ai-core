name: core-ci

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Go dependency lock check
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Go format check
        run: |
          UNFORMATTED="$(gofmt -l ./cmd ./internal)"
          if [ -n "$UNFORMATTED" ]; then
            echo "The following Go files need gofmt:"
            echo "$UNFORMATTED"
            gofmt -d $UNFORMATTED
            exit 1
          fi

      - name: Schema syntax check
        run: |
          for file in schemas/*.json; do
            python3 -m json.tool "$file" >/dev/null
          done

      - name: Shell syntax check
        run: |
          sh -n scripts/build.sh
          sh -n scripts/build-deb.sh
          sh -n scripts/server-smoke.sh
          sh -n packaging/debian/install-local.sh

      - name: Install Web dependencies
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Web typecheck
        working-directory: web
        run: npm run typecheck

      - name: Web tests
        working-directory: web
        run: npm test

      - name: Web production build
        working-directory: web
        run: npm run build

      - name: Go tests
        run: go test ./...

      - name: Go vet
        run: go vet ./...

      - name: Core build
        run: ./scripts/build.sh

      - name: Integration smoke test
        run: |
          set -eu
          STATE_DIR="$(mktemp -d)"
          LOG_FILE="$(mktemp)"
          COOKIE_JAR="$(mktemp)"
          ./build/home-ai-core             --state-dir "$STATE_DIR"             --web-dir "$GITHUB_WORKSPACE/web/dist"             --listen 127.0.0.1:18080             >"$LOG_FILE" 2>&1 &
          PID=$!
          cleanup() {
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
            rm -rf "$STATE_DIR" "$LOG_FILE" "$COOKIE_JAR"
          }
          trap cleanup EXIT INT TERM

          ready=0
          for _ in $(seq 1 75); do
            if curl --fail --silent http://127.0.0.1:18080/health >/tmp/home-ai-health.json; then
              ready=1
              break
            fi
            sleep 0.2
          done

          if [ "$ready" -ne 1 ]; then
            cat "$LOG_FILE"
            exit 1
          fi

          curl --fail --silent http://127.0.0.1:18080/ >/tmp/home-ai-index.html
          curl --fail --silent http://127.0.0.1:18080/system >/tmp/home-ai-system-page.html
          grep -q "Home-AI-Core" /tmp/home-ai-index.html
          grep -q "Home-AI-Core" /tmp/home-ai-system-page.html

          curl --fail --silent             http://127.0.0.1:18080/api/v1/security/setup-status             >/tmp/home-ai-setup.json

          test -f "$STATE_DIR/bootstrap-token"
          BOOTSTRAP_TOKEN="$(tr -d '\r\n' < "$STATE_DIR/bootstrap-token")"

          UNAUTH_STATUS="$(curl --silent --output /tmp/home-ai-unauth.json --write-out '%{http_code}'             http://127.0.0.1:18080/api/v1/system)"
          test "$UNAUTH_STATUS" = "401"

          curl --fail --silent             --cookie-jar "$COOKIE_JAR"             -H "Content-Type: application/json"             -H "X-Home-AI-Bootstrap-Token: $BOOTSTRAP_TOKEN"             --data '{"username":"owner","display_name":"CI Owner","password":"integration-test-owner-passphrase","session_mode":"cookie"}'             http://127.0.0.1:18080/api/v1/security/bootstrap             >/tmp/home-ai-bootstrap.json

          test ! -f "$STATE_DIR/bootstrap-token"

          curl --fail --silent             --cookie "$COOKIE_JAR"             http://127.0.0.1:18080/api/v1/system             >/tmp/home-ai-system.json

          curl --fail --silent             --cookie "$COOKIE_JAR"             http://127.0.0.1:18080/api/v1/auth/me             >/tmp/home-ai-me.json

          curl --fail --silent             --cookie "$COOKIE_JAR"             http://127.0.0.1:18080/api/v1/modules             >/tmp/home-ai-modules.json

          curl --fail --silent             --cookie "$COOKIE_JAR"             http://127.0.0.1:18080/api/v1/audit             >/tmp/home-ai-audit.json

          CSRF_TOKEN="$(python3 - <<'PY'
          import json
          with open("/tmp/home-ai-bootstrap.json", "r", encoding="utf-8") as f:
              print(json.load(f)["csrf_token"])
          PY
          )"

          curl --fail --silent             --cookie "$COOKIE_JAR"             -H "X-CSRF-Token: $CSRF_TOKEN"             -X POST             http://127.0.0.1:18080/api/v1/auth/logout             >/dev/null

          REVOKED_STATUS="$(curl --silent --output /tmp/home-ai-revoked.json --write-out '%{http_code}'             --cookie "$COOKIE_JAR"             http://127.0.0.1:18080/api/v1/system)"
          test "$REVOKED_STATUS" = "401"

          python3 - <<'PY'
          import json

          with open("/tmp/home-ai-health.json", "r", encoding="utf-8") as f:
              health = json.load(f)
          assert health["status"] == "ok"

          with open("/tmp/home-ai-setup.json", "r", encoding="utf-8") as f:
              setup = json.load(f)
          assert setup["initialized"] is False

          with open("/tmp/home-ai-system.json", "r", encoding="utf-8") as f:
              system = json.load(f)
          assert system["schema_version"] >= 6
          assert system["system"]["node_id"]
          assert system["system"]["cpu"]["logical_cpus"] >= 1

          with open("/tmp/home-ai-me.json", "r", encoding="utf-8") as f:
              me = json.load(f)
          assert me["actor"]["username"] == "owner"
          assert "system.read" in me["actor"]["permissions"]

          with open("/tmp/home-ai-modules.json", "r", encoding="utf-8") as f:
              modules = json.load(f)
          assert "modules" in modules

          with open("/tmp/home-ai-audit.json", "r", encoding="utf-8") as f:
              audit = json.load(f)
          assert any(event["action"] == "security.bootstrap" for event in audit["events"])
          PY

          test -f "$STATE_DIR/core.db"
          test -f "$STATE_DIR/identity/node-id"

      - name: Cross-build Linux targets
        run: |
          VERSION="$(cat VERSION)"
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build               -trimpath               -ldflags "-s -w -X github.com/DeadSoulf/home-ai-core/internal/version.Version=$VERSION"               -o "/tmp/home-ai-core-linux-$arch"               ./cmd/home-ai-core
          done


      - name: Build Debian packages
        run: |
          HOME_AI_SKIP_WEB_BUILD=1 sh ./scripts/build-deb.sh amd64
          HOME_AI_SKIP_WEB_BUILD=1 sh ./scripts/build-deb.sh arm64

          AMD64_PACKAGE="$(find build/packages -maxdepth 1 -name 'home-ai-core_*_amd64.deb' -print -quit)"
          ARM64_PACKAGE="$(find build/packages -maxdepth 1 -name 'home-ai-core_*_arm64.deb' -print -quit)"

          test -n "$AMD64_PACKAGE"
          test -n "$ARM64_PACKAGE"
          test "$(dpkg-deb -f "$AMD64_PACKAGE" Package)" = "home-ai-core"
          test "$(dpkg-deb -f "$AMD64_PACKAGE" Architecture)" = "amd64"
          PACKAGE_DEPENDS="$(dpkg-deb -f "$AMD64_PACKAGE" Depends)"
          grep -q 'pci.ids' <<<"$PACKAGE_DEPENDS"
          grep -q 'smartmontools' <<<"$PACKAGE_DEPENDS"
          test "$(dpkg-deb -f "$ARM64_PACKAGE" Architecture)" = "arm64"

          PACKAGE_CONTENTS="$(dpkg-deb --contents "$AMD64_PACKAGE")"
          grep -q './usr/bin/home-ai-core' <<<"$PACKAGE_CONTENTS"
          grep -q './usr/libexec/home-ai-core/home-ai-core-updater' <<<"$PACKAGE_CONTENTS"
          grep -q './usr/share/home-ai-core/web/index.html' <<<"$PACKAGE_CONTENTS"
          grep -q './lib/systemd/system/home-ai-core.service' <<<"$PACKAGE_CONTENTS"
          grep -q './lib/systemd/system/home-ai-core-updater.service' <<<"$PACKAGE_CONTENTS"
          grep -q './usr/lib/sysusers.d/home-ai-core.conf' <<<"$PACKAGE_CONTENTS"
          grep -q './etc/home-ai-core/home-ai-core.env' <<<"$PACKAGE_CONTENTS"


          PACKAGE_ROOT="$(mktemp -d)"
          PACKAGE_STATE="$(mktemp -d)"
          PACKAGE_LOG="$(mktemp)"
          dpkg-deb -x "$AMD64_PACKAGE" "$PACKAGE_ROOT"

          "$PACKAGE_ROOT/usr/bin/home-ai-core" \
            --state-dir "$PACKAGE_STATE" \
            --web-dir "$PACKAGE_ROOT/usr/share/home-ai-core/web" \
            --listen 127.0.0.1:18081 \
            >"$PACKAGE_LOG" 2>&1 &
          PACKAGE_PID=$!

          package_cleanup() {
            kill "$PACKAGE_PID" 2>/dev/null || true
            wait "$PACKAGE_PID" 2>/dev/null || true
            rm -rf "$PACKAGE_ROOT" "$PACKAGE_STATE" "$PACKAGE_LOG"
          }
          trap package_cleanup EXIT INT TERM

          PACKAGE_READY=0
          for _ in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:18081/health >/dev/null; then
              PACKAGE_READY=1
              break
            fi
            sleep 0.2
          done

          if [ "$PACKAGE_READY" -ne 1 ]; then
            cat "$PACKAGE_LOG"
            exit 1
          fi

          curl --fail --silent http://127.0.0.1:18081/ >/tmp/home-ai-package-index.html
          grep -q 'Home-AI-Core' /tmp/home-ai-package-index.html
          package_cleanup
          trap - EXIT INT TERM

          python3 - <<'PY'
          import glob
          import hashlib
          import json
          import os

          version = open("VERSION", encoding="utf-8").read().strip()
          debian_version = version.replace("-", "~")
          packages = {}
          for arch in ("amd64", "arm64"):
              matches = glob.glob(f"build/packages/home-ai-core_*_{arch}.deb")
              if len(matches) != 1:
                  raise SystemExit(f"expected exactly one {arch} package, got {matches}")
              path = matches[0]
              h = hashlib.sha256()
              with open(path, "rb") as package:
                  for chunk in iter(lambda: package.read(1024 * 1024), b""):
                      h.update(chunk)
              packages[arch] = {
                  "file": os.path.basename(path),
                  "sha256": h.hexdigest(),
                  "size_bytes": os.path.getsize(path),
                  "debian_version": debian_version,
              }

          manifest = {
              "schema_version": 1,
              "version": version,
              "packages": packages,
          }
          with open("build/packages/home-ai-core-update.json", "w", encoding="utf-8") as out:
              json.dump(manifest, out, indent=2, sort_keys=True)
              out.write("\n")
          PY


      - name: Upload Debian packages
        uses: actions/upload-artifact@v4
        with:
          name: home-ai-core-deb-${{ github.sha }}
          path: |
            build/packages/*.deb
            build/packages/home-ai-core-update.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish development release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          VERSION="$(tr -d '\r\n' < VERSION)"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              build/packages/*.deb \
              build/packages/home-ai-core-update.json \
              --clobber
          else
            gh release create "$TAG" \
              build/packages/*.deb \
              build/packages/home-ai-core-update.json \
              --target "$GITHUB_SHA" \
              --title "Home-AI-Core $VERSION" \
              --notes "Automated Home-AI-Core development build $VERSION. Install from Web UI on nodes that already include the Core update helper." \
              --prerelease
          fi
