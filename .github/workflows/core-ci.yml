name: core-ci

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  debian-installer-test:
    name: Debian initial installer build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: false
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Check installer scripts
        run: |
          sh -n scripts/install.sh
          sh -n packaging/debian/install-local.sh
      - name: Build Web once
        working-directory: web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Build and inspect Debian installers
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            HOME_AI_SKIP_WEB_BUILD=1 sh ./scripts/build-deb.sh "$arch"
            DEB="$(find build/packages -maxdepth 1 -type f -name "home-ai-core_*_${arch}.deb" -print -quit)"
            test -n "$DEB"
            dpkg-deb --info "$DEB" >/dev/null
            CONTENTS="$(mktemp)"
            dpkg-deb --contents "$DEB" > "$CONTENTS"
            grep -q 'usr/bin/home-ai-core' "$CONTENTS"
            grep -q 'usr/libexec/home-ai-core/home-ai-core-updater' "$CONTENTS"
            rm -f "$CONTENTS"
            sha256sum "$DEB" > "$DEB.sha256"
          done

  windows-client-test:
    name: Windows client tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: false
      - name: Embed Windows manifest for test binary
        shell: bash
        run: sh ./scripts/build-windows-client-resource.sh amd64
      - name: Test Windows copy engine, queue and CLI
        run: go test ./internal/windowsclient ./cmd/home-ai-windows-client

      - name: Build Windows UI preview for PR review and installer test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $version = (Get-Content -Raw VERSION).Trim()
          go build -trimpath -ldflags "-X github.com/DeadSoulf/home-ai-core/internal/version.Version=$version" -o dist/home-ai-windows-client-preview_amd64.exe ./cmd/home-ai-windows-client
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash -Algorithm SHA256 dist/home-ai-windows-client-preview_amd64.exe).Hash.ToLowerInvariant()
          "$hash  home-ai-windows-client-preview_amd64.exe" | Out-File -FilePath dist/home-ai-windows-client-preview_amd64.exe.sha256 -NoNewline -Encoding ascii

      - name: Install NSIS compiler
        shell: pwsh
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
          if (!(Test-Path -LiteralPath $nsis)) {
            choco install nsis --version=3.12.0 -y --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (!(Test-Path -LiteralPath $nsis)) { throw "NSIS compiler unavailable" }

      - name: Build and smoke-test Windows Setup and uninstaller
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
          $version = (Get-Content -Raw VERSION).Trim()
          $client = (Resolve-Path -LiteralPath 'dist/home-ai-windows-client-preview_amd64.exe').Path
          $setup = Join-Path (Resolve-Path -LiteralPath 'dist').Path 'HOMEAI-Setup-preview_amd64.exe'
          & $nsis /V3 /WX "/DVERSION=$version" "/DCLIENT_EXE=$client" "/DOUTFILE=$setup" packaging/windows/home-ai-client.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path -LiteralPath $setup)) { throw 'NSIS installer was not created' }
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  HOMEAI-Setup-preview_amd64.exe" | Out-File -FilePath "$setup.sha256" -NoNewline -Encoding ascii

          $configDirectory = Join-Path $env:APPDATA 'HomeAI'
          New-Item -ItemType Directory -Path $configDirectory -Force | Out-Null
          $sentinel = Join-Path $configDirectory 'setup-ci-preserve-this.txt'
          Set-Content -LiteralPath $sentinel -Value 'preserve Home AI user profiles' -NoNewline
          $installed = Join-Path $env:LOCALAPPDATA 'HomeAI\bin\home-ai-windows-client.exe'
          $uninstaller = Join-Path $env:LOCALAPPDATA 'HomeAI\bin\Uninstall HOME AI.exe'
          $shortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\HOME AI\HOME AI.lnk'
          $uninstallKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\HomeAIWindowsClient'
          for ($pass = 0; $pass -lt 2; $pass++) {
            $process = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Setup failed (pass $pass): $($process.ExitCode)" }
            Write-Host "Install pass=$pass exit=$($process.ExitCode)"
            Write-Host "INSTALLED_PATH=$installed EXISTS=$(Test-Path -LiteralPath $installed)"
            Write-Host "UNINSTALL_PATH=$uninstaller EXISTS=$(Test-Path -LiteralPath $uninstaller)"
            Write-Host "START_MENU_PATH=$shortcut EXISTS=$(Test-Path -LiteralPath $shortcut)"
            Write-Host "REGISTRY_PRESENT=$(Test-Path -LiteralPath $uninstallKey)"
            if (Test-Path -LiteralPath $uninstallKey) {
              $record = Get-ItemProperty -LiteralPath $uninstallKey
              Write-Host "REGISTERED_INSTALLDIR=$($record.InstallLocation) UNINSTALL_CMD=$($record.UninstallString)"
            }
            Write-Host "BIN_DIRECTORY_CONTENTS:"
            Get-ChildItem -LiteralPath (Split-Path $installed -Parent) -ErrorAction SilentlyContinue |
              Select-Object Name,Length,FullName | Format-Table -AutoSize | Out-String | Write-Host
            if (!(Test-Path -LiteralPath $installed) -or !(Test-Path -LiteralPath $uninstaller)) { throw 'Client or uninstaller is missing' }
            if (!(Test-Path -LiteralPath $shortcut)) { throw 'Start Menu shortcut missing' }
            $shell = New-Object -ComObject WScript.Shell
            $shortcutTarget = $shell.CreateShortcut($shortcut).TargetPath
            if ($shortcutTarget -ne $installed) {
              throw "Start Menu shortcut points to $shortcutTarget rather than $installed"
            }
            if (!(Test-Path -LiteralPath $sentinel)) { throw 'Sync data removed during install' }
            if ((Get-FileHash -LiteralPath $installed -Algorithm SHA256).Hash -ne
                (Get-FileHash -LiteralPath $client -Algorithm SHA256).Hash) { throw 'Installed client SHA-256 mismatch' }
            $apps = Get-ItemProperty -LiteralPath $uninstallKey -ErrorAction Stop
            if ($apps.DisplayName -ne 'HOME AI Windows Client' -or $apps.DisplayVersion -ne $version) {
              throw 'Windows Apps install registry entry is incorrect'
            }
          }
          $remove = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "Uninstaller failed: $($remove.ExitCode)" }
          if (Test-Path -LiteralPath $uninstallKey) { throw 'Apps uninstall registry entry survived uninstall' }
          if (Test-Path -LiteralPath $shortcut) { throw 'Start Menu shortcut survived uninstall' }
          if (Test-Path -LiteralPath $installed) { throw 'App EXE survived uninstall' }
          if (!(Test-Path -LiteralPath $sentinel)) { throw 'Uninstall deleted the user profile sentinel' }

      - name: Upload unsigned test preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: windows-client-ui-preview
          path: |
            dist/*.exe
            dist/*.exe.sha256
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      - name: Go dependency lock check
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Validate Windows resource manifest
        run: python3 -m json.tool cmd/home-ai-windows-client/winres/winres.json >/dev/null

      - name: Go format check
        run: |
          UNFORMATTED="$(gofmt -l ./cmd ./internal)"
          if [ -n "$UNFORMATTED" ]; then
            echo "The following Go files need gofmt:"
            echo "$UNFORMATTED"
            gofmt -d $UNFORMATTED
            exit 1
          fi

      - name: Schema syntax check
        run: |
          for file in schemas/*.json; do
            python3 -m json.tool "$file" >/dev/null
          done

      - name: Shell syntax check
        run: |
          sh -n scripts/build.sh
          sh -n scripts/build-deb.sh
          sh -n scripts/build-update-bundle.sh
          sh -n scripts/server-smoke.sh
          sh -n packaging/debian/install-local.sh

      - name: Release signing regressions (disposable keys only)
        run: |
          bash -n scripts/sign-release-assets.sh
          python3 scripts/tests/test_release_signing.py

      - name: Install Web dependencies
        working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Web typecheck
        working-directory: web
        run: npm run typecheck

      - name: Web tests
        working-directory: web
        run: npm test

      - name: Web production build
        working-directory: web
        run: npm run build

      - name: Go tests
        run: go test ./...

      - name: Go vet
        run: go vet ./...

      - name: Core build
        run: ./scripts/build.sh

      - name: Integration smoke test
        run: |
          set -eu
          STATE_DIR="$(mktemp -d)"
          curl() { command curl --cacert "$STATE_DIR/tls/server.crt" "$@"; }
          LOG_FILE="$(mktemp)"
          COOKIE_JAR="$(mktemp)"
          ./build/home-ai-core             --state-dir "$STATE_DIR"             --web-dir "$GITHUB_WORKSPACE/web/dist"             --listen 127.0.0.1:18082             >"$LOG_FILE" 2>&1 &
          PID=$!
          cleanup() {
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
            rm -rf "$STATE_DIR" "$LOG_FILE" "$COOKIE_JAR"
          }
          trap cleanup EXIT INT TERM

          ready=0
          for _ in $(seq 1 75); do
            if curl --fail --silent https://127.0.0.1:18082/health >/tmp/home-ai-health.json; then
              ready=1
              break
            fi
            sleep 0.2
          done

          if [ "$ready" -ne 1 ]; then
            cat "$LOG_FILE"
            exit 1
          fi

          curl --fail --silent https://127.0.0.1:18082/ >/tmp/home-ai-index.html
          curl --fail --silent https://127.0.0.1:18082/system >/tmp/home-ai-system-page.html
          curl --fail --silent https://127.0.0.1:18082/files/storage >/tmp/home-ai-files-storage-page.html
          grep -q "Home-AI-Core" /tmp/home-ai-index.html
          grep -q "Home-AI-Core" /tmp/home-ai-system-page.html
          grep -q "Home-AI-Core" /tmp/home-ai-files-storage-page.html

          curl --fail --silent             https://127.0.0.1:18082/api/v1/security/setup-status             >/tmp/home-ai-setup.json

          UNAUTH_STATUS="$(curl --silent --output /tmp/home-ai-unauth.json --write-out '%{http_code}'             https://127.0.0.1:18082/api/v1/system)"
          test "$UNAUTH_STATUS" = "401"

          BOOTSTRAP_TOKEN="$(tr -d '\r\n' < "$STATE_DIR/bootstrap-token")"
          curl --fail --silent             --cookie-jar "$COOKIE_JAR"             -H "Content-Type: application/json"             --data "{\"username\":\"owner\",\"display_name\":\"CI Owner\",\"password\":\"integration-test-owner-passphrase\",\"session_mode\":\"cookie\",\"bootstrap_token\":\"$BOOTSTRAP_TOKEN\"}"             https://127.0.0.1:18082/api/v1/security/bootstrap             >/tmp/home-ai-bootstrap.json

          curl --fail --silent             --cookie "$COOKIE_JAR"             https://127.0.0.1:18082/api/v1/system             >/tmp/home-ai-system.json

          curl --fail --silent             --cookie "$COOKIE_JAR"             https://127.0.0.1:18082/api/v1/auth/me             >/tmp/home-ai-me.json

          curl --fail --silent             --cookie "$COOKIE_JAR"             https://127.0.0.1:18082/api/v1/modules             >/tmp/home-ai-modules.json

          curl --fail --silent             --cookie "$COOKIE_JAR"             https://127.0.0.1:18082/api/v1/audit             >/tmp/home-ai-audit.json

          CSRF_TOKEN="$(python3 - <<'PY'
          import json
          with open("/tmp/home-ai-bootstrap.json", "r", encoding="utf-8") as f:
              print(json.load(f)["csrf_token"])
          PY
          )"

          curl --fail --silent             --cookie "$COOKIE_JAR"             -H "X-CSRF-Token: $CSRF_TOKEN"             -X POST             https://127.0.0.1:18082/api/v1/auth/logout             >/dev/null

          REVOKED_STATUS="$(curl --silent --output /tmp/home-ai-revoked.json --write-out '%{http_code}'             --cookie "$COOKIE_JAR"             https://127.0.0.1:18082/api/v1/system)"
          test "$REVOKED_STATUS" = "401"

          python3 - <<'PY'
          import json

          with open("/tmp/home-ai-health.json", "r", encoding="utf-8") as f:
              health = json.load(f)
          assert health["status"] == "ok"

          with open("/tmp/home-ai-setup.json", "r", encoding="utf-8") as f:
              setup = json.load(f)
          assert setup["initialized"] is False

          with open("/tmp/home-ai-system.json", "r", encoding="utf-8") as f:
              system = json.load(f)
          assert system["schema_version"] >= 8
          assert system["system"]["node_id"]
          assert system["system"]["cpu"]["logical_cpus"] >= 1

          with open("/tmp/home-ai-me.json", "r", encoding="utf-8") as f:
              me = json.load(f)
          assert me["actor"]["username"] == "owner"
          assert "system.read" in me["actor"]["permissions"]

          with open("/tmp/home-ai-modules.json", "r", encoding="utf-8") as f:
              modules = json.load(f)
          assert "modules" in modules

          with open("/tmp/home-ai-audit.json", "r", encoding="utf-8") as f:
              audit = json.load(f)
          assert any(event["action"] == "security.bootstrap" for event in audit["events"])
          PY

          test -f "$STATE_DIR/core.db"
          test -f "$STATE_DIR/identity/node-id"

      - name: Cross-build Linux targets
        run: |
          VERSION="$(cat VERSION)"
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build               -trimpath               -ldflags "-s -w -X github.com/DeadSoulf/home-ai-core/internal/version.Version=$VERSION"               -o "/tmp/home-ai-core-linux-$arch"               ./cmd/home-ai-core
          done

      - name: Cross-build Windows file client
        run: |
          sh ./scripts/build-windows-client-resource.sh amd64
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build             -trimpath             -o /tmp/home-ai-windows-client.exe             ./cmd/home-ai-windows-client
