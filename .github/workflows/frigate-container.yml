name: Verify official Frigate container and rollback

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-frigate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Verify real official releases and both architecture digests
        run: FRIGATE_LIVE_TEST=1 go test -v ./internal/frigate -run TestOfficialUpstreamLive -count=1
      - name: Real Docker startup, SQLite rollback and crash recovery
        shell: bash
        run: |
          set -euo pipefail
          go test -c -o /tmp/home-ai-frigate-integration.test ./cmd/home-ai-core-updater
          sudo env FRIGATE_DOCKER_TEST=1 /tmp/home-ai-frigate-integration.test \
            -test.run=TestFrigateDockerLifecycle -test.v -test.timeout=25m 2>&1 | tee frigate-container-test.log
      - name: Preserve actual container test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frigate-container-validation
          path: frigate-container-test.log
          if-no-files-found: warn

  native-browser:
    name: Original Frigate UI, live video, archive and exports
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/frigate-browsers
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build real Core frontend and API fixture
        run: |
          cd web
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          cd ..
          go test -c -o /tmp/home-ai-frigate-api.test ./internal/api
      - name: Install browser test runtime
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Exercise original container through real authenticated TLS gateway
        shell: bash
        run: |
          set -euo pipefail
          sudo env FRIGATE_BROWSER_PYTHON="$(command -v python)" PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" \
            bash scripts/test-frigate-native-ui.sh 2>&1 | tee native-frigate-acceptance.log
      - name: Preserve real native UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frigate-native-ui-validation
          path: |
            native-frigate-acceptance.log
            build/validation/native-ui-fixture.log
            build/validation/native-ui-evidence/
          if-no-files-found: warn
