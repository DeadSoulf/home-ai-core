name: Publish update bundles

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build update bundle ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test Go
        run: go test ./...

      - name: Typecheck Web
        working-directory: web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck

      - name: Build update bundle
        run: sh ./scripts/build-update-bundle.sh "${{ matrix.arch }}"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: update-${{ matrix.arch }}
          path: |
            build/updates/*.tar.gz
            build/updates/*.tar.gz.sha256
          if-no-files-found: error

  windows-client:
    name: Build Windows file client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Build Windows client
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          mkdir -p dist
          EXE="dist/home-ai-windows-client_${VERSION}_amd64.exe"
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build \
            -trimpath \
            -o "$EXE" \
            ./cmd/home-ai-windows-client
          sha256sum "$EXE" > "$EXE.sha256"

      - name: Upload Windows client artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-client
          path: |
            dist/*.exe
            dist/*.exe.sha256
          if-no-files-found: error
  release:
    name: Publish GitHub release
    needs: [build, windows-client]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          pattern: update-*
          merge-multiple: true
          path: dist

      - name: Download Windows client
        uses: actions/download-artifact@v4
        with:
          name: windows-client
          path: dist

      - name: Sign Core update checksums
        env:
          HOME_AI_UPDATE_SIGNING_KEY: ${{ secrets.HOME_AI_UPDATE_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          KEY_FILE="$RUNNER_TEMP/home-ai-update-signing-key.pem"

          if [[ -z "${HOME_AI_UPDATE_SIGNING_KEY:-}" ]]; then
            if [[ "$VERSION" != *-dev* ]]; then
              echo "HOME_AI_UPDATE_SIGNING_KEY is required for non-development releases" >&2
              exit 1
            fi
            echo "No update signing key configured; development bundles remain unsigned"
            exit 0
          fi

          printf '%s\n' "$HOME_AI_UPDATE_SIGNING_KEY" > "$KEY_FILE"
          chmod 0600 "$KEY_FILE"
          trap 'rm -f "$KEY_FILE" "$RUNNER_TEMP"/*.sig.bin' EXIT

          found=0
          for checksum in dist/home-ai-core-update_*.tar.gz.sha256; do
            [[ -f "$checksum" ]] || continue
            found=1
            raw="$RUNNER_TEMP/$(basename "$checksum").sig.bin"
            openssl pkeyutl -sign -rawin -inkey "$KEY_FILE" -in "$checksum" -out "$raw"
            base64 -w 0 "$raw" > "$checksum.sig"
            printf '\n' >> "$checksum.sig"
          done
          if [[ "$found" -ne 1 ]]; then
            echo "No Core update checksum files found to sign" >&2
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          TAG="v$VERSION"

          ls -lh dist

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "Home-AI-Core $VERSION" \
              --generate-notes \
              --prerelease
          fi
