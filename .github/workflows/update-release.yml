name: Publish update bundles

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build update bundle ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test Go
        run: go test ./...

      - name: Typecheck Web
        working-directory: web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck

      - name: Build update bundle
        run: sh ./scripts/build-update-bundle.sh "${{ matrix.arch }}"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: update-${{ matrix.arch }}
          path: |
            build/updates/*.tar.gz
            build/updates/*.tar.gz.sha256
          if-no-files-found: error

  debian-installer:
    name: Build initial Debian installer ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build initial Debian installer
        shell: bash
        run: |
          set -euo pipefail
          sh ./scripts/build-deb.sh "${{ matrix.arch }}"
          DEB="$(find build/packages -maxdepth 1 -type f -name "home-ai-core_*.deb" -print -quit)"
          test -n "$DEB"
          dpkg-deb --info "$DEB" >/dev/null
          CONTENTS="$(mktemp)"
          dpkg-deb --contents "$DEB" > "$CONTENTS"
          grep -q 'usr/bin/home-ai-core' "$CONTENTS"
          grep -q 'usr/libexec/home-ai-core/home-ai-core-updater' "$CONTENTS"
          rm -f "$CONTENTS"
          sha256sum "$DEB" > "$DEB.sha256"

      - name: Upload Debian installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.arch }}
          path: |
            build/packages/*.deb
            build/packages/*.deb.sha256
          if-no-files-found: error

  windows-client:
    name: Build Windows file client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Build Windows client
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          mkdir -p dist
          EXE="dist/home-ai-windows-client_${VERSION}_amd64.exe"
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build \
            -trimpath \
            -o "$EXE" \
            ./cmd/home-ai-windows-client
          sha256sum "$EXE" > "$EXE.sha256"

      - name: Upload Windows client artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-client
          path: |
            dist/*.exe
            dist/*.exe.sha256
          if-no-files-found: error
  release:
    name: Publish GitHub release
    needs: [build, debian-installer, windows-client]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          pattern: update-*
          merge-multiple: true
          path: dist

      - name: Download Debian installers
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: dist

      - name: Download Windows client
        uses: actions/download-artifact@v4
        with:
          name: windows-client
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          TAG="v$VERSION"

          ls -lh dist

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "Home-AI-Core $VERSION" \
              --generate-notes \
              --prerelease
          fi
