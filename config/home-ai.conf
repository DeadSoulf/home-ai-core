# Home AI Core configuration

core.name=Home AI Core
# core.version is compiled from the repository VERSION file.

log.level=debug

runtime.tick_ms=250

web.bind=0.0.0.0
web.port=8080

security.database_file=runtime/security/security.db
# Legacy files are imported once into the central database.
security.users_file=runtime/security/users.db
security.audit_file=runtime/security/audit.log

# Comma-separated mount points used by Home AI Core.
# Example:
# storage.video_mounts=/mnt/video1,/mnt/video2
# storage.personal_mounts=/mnt/files1
storage.video_mounts=
storage.personal_mounts=
storage.vm_mounts=

# Storage pool placement policies:
# most_free, sequential, balanced, pinned
storage.video_policy=most_free
storage.files_policy=most_free
storage.vm_policy=most_free

# Keep this reserve unused on every pool volume.
# Effective reserve is the larger of percent and GB.
storage.video_reserve_percent=10
storage.files_reserve_percent=10
storage.vm_reserve_percent=10
storage.video_reserve_gb=0
storage.files_reserve_gb=0
storage.vm_reserve_gb=0

# Optional preferred mount when policy=pinned.
# Per-camera pinning will reuse the same stable mount identifiers.
storage.video_pinned_mount=
storage.files_pinned_mount=
storage.vm_pinned_mount=

# GitHub self-update settings for the development server.
update.repository=/srv/home-ai-core
update.remote=origin
update.branch=develop
update.check_interval_seconds=60

# Optional display-class PCI device selected for future AI workloads.
ai.accelerator.pci_address=


# Cluster Core. Disabled by default.
# controller = accepts worker heartbeats and makes placement decisions.
# worker = reports local load to cluster.controller_host.
# Use only on a trusted LAN or WireGuard network.
cluster.enabled=false
cluster.role=controller
cluster.node_id=
cluster.node_name=
cluster.advertise_address=
cluster.controller_host=
cluster.controller_port=8080
cluster.shared_token=
cluster.heartbeat_interval_seconds=5
cluster.timeout_seconds=20
