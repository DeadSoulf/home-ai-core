# Home AI Core configuration

core.name=Home AI Core
core.version=0.0.6

log.level=debug

runtime.tick_ms=250

web.bind=0.0.0.0
web.port=8080

security.users_file=runtime/security/users.db
security.audit_file=runtime/security/audit.log

# Comma-separated mount points used by Home AI Core.
# Example:
# storage.video_mounts=/mnt/video1,/mnt/video2
# storage.personal_mounts=/mnt/files1
storage.video_mounts=
storage.personal_mounts=

# GitHub self-update settings for the development server.
update.repository=/srv/home-ai-core
update.remote=origin
update.branch=develop
update.check_interval_seconds=60
